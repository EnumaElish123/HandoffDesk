name: Build unsigned portable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            extra: tui
          - os: windows-latest
            extra: desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install ".[${{ matrix.extra }}]" "PyInstaller>=6,<7"
      - run: python scripts/build_portable.py
      - name: Check Linux bundle
        if: runner.os == 'Linux'
        run: |
          dist/HandoffDesk/handoffdesk --version
          test -f dist/HandoffDesk/_internal/handoffdesk/integrations/handoffdesk/SKILL.md
          test -f dist/HandoffDesk/_internal/handoffdesk/web/index.html
      - name: Check Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist/HandoffDesk/HandoffDeskCLI.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI failed' }
          foreach ($path in @('dist/HandoffDesk/HandoffDesk.exe', 'dist/HandoffDesk/_internal/handoffdesk/integrations/handoffdesk/SKILL.md', 'dist/HandoffDesk/_internal/handoffdesk/web/index.html')) {
            if (-not (Test-Path $path)) { throw "Missing package file: $path" }
          }
      - name: Build Windows user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is unavailable' }
          $version = python -c "import handoffdesk; print(handoffdesk.__version__)"
          & $iscc "/DAppVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoffdesk-${{ runner.os }}-unsigned
          path: dist/
          retention-days: 14
