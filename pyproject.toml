[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffdesk"
dynamic = ["version"]
description = "Local progress records for AI agents and a desktop for people to resume work."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "HandoffDesk contributors"}]
dependencies = ["tzdata>=2024.1"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.optional-dependencies]
tui = ["textual==6.12.0"]
desktop = ["pywebview==6.2.1; sys_platform == 'win32'"]
dev = ["textual==6.12.0", "playwright==1.48.0"]

[project.urls]
Homepage = "https://github.com/EnumaElish123/HandoffDesk"
Repository = "https://github.com/EnumaElish123/HandoffDesk.git"
Issues = "https://github.com/EnumaElish123/HandoffDesk/issues"

[project.scripts]
handoffdesk = "handoffdesk.cli:main"

[project.gui-scripts]
handoffdesk-desktop = "handoffdesk.__main__:run"

[tool.setuptools]
packages = ["handoffdesk"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "handoffdesk.__version__"}

[tool.setuptools.package-data]
handoffdesk = ["assets/*.png", "assets/*.ico", "assets/*.svg", "web/*.html", "web/*.css", "web/*.js", "integrations/*", "integrations/**/*"]
